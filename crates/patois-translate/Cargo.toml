[package]
name = "patois-translate"
version = "0.1.5"
description = "Translate gettext catalogs and Markdown readmes with the Claude API, rejecting translations that lose placeholders, accelerators, or shortcuts."
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords = ["i18n", "l10n", "gettext", "translation", "claude"]
categories = ["internationalization", "localization", "development-tools"]

[dependencies]
patois = { version = "0.3.0", path = "../patois" }
patois-build = { version = "0.1.18", path = "../patois-build" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }

[lints]
workspace = true
