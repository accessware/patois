[package]
name = "patois"
version = "0.2.4"
description = "Gettext translations for Rust desktop apps: embedded catalogs, plural rules, and language selection, with optional wxDragon integration."
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["i18n", "l10n", "gettext", "translation", "wxdragon"]
categories = ["internationalization", "localization", "gui"]

[package.metadata.docs.rs]
features = ["wx"]

[features]
wx = ["dep:wxdragon"]

[dependencies]
inventory = "0.3.25"
miniz_oxide = "0.9.1"
patois-macros = { version = "=0.2.1", path = "../patois-macros" }
sys-locale = "0.3.2"
wxdragon = { version = "0.9.24", optional = true, default-features = false }
