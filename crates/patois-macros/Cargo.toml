[package]
name = "patois-macros"
version = "0.2.1"
description = "Procedural macros for patois that embed compiled gettext catalogs in a binary at compile time."
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["i18n", "l10n", "gettext", "translation"]
categories = ["internationalization", "localization"]

[lib]
proc-macro = true

[dependencies]
miniz_oxide = "0.9.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
